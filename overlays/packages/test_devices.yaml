      bathroom_main:
        friendly_name: "Bathroom main light"
        value_template: "{{ is_state('input_boolean.light_bathroom_main_state', 'on') }}"
        level_template: "{{ states('input_number.light_bathroom_main_brightness') | int(0) }}"
        turn_on:
          - service: input_boolean.turn_on
