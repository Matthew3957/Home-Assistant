# ---------------------------------------------------------------------------
# Template locks — front and back door
# ---------------------------------------------------------------------------
lock:
  - platform: template
    name: "Front door"
    value_template: "{{ is_state('input_boolean.lock_front_door_state', 'on') }}"
    lock:
      service: input_boolean.turn_on
      target: { entity_id: input_boolean.lock_front_door_state }
    unlock:
      service: input_boolean.turn_off
      target: { entity_id: input_boolean.lock_front_door_state }
  - platform: template
    name: "Back door"
    value_template: "{{ is_state('input_boolean.lock_back_door_state', 'on') }}"
    lock:
      service: input_boolean.turn_on
      target: { entity_id: input_boolean.lock_back_door_state }
    unlock:
      service: input_boolean.turn_off
      target: { entity_id: input_boolean.lock_back_door_state }

# ---------------------------------------------------------------------------
# Climate — generic_thermostat per room
# ---------------------------------------------------------------------------
# generic_thermostat needs:
#   heater: a switch-like entity it can turn on/off
#   target_sensor: a sensor entity reporting the current temperature
# We back both with input_boolean / template sensor so the whole stack is
# self-contained and doesn't require any real hardware.
climate:
  - platform: generic_thermostat
    name: "Living room thermostat"
    heater: input_boolean.climate_living_room_heater_state
    target_sensor: sensor.living_room_temperature
    min_temp: 55
    max_temp: 85
    target_temp: 70
    cold_tolerance: 0.5
    hot_tolerance: 0.5
  - platform: generic_thermostat
    name: "Bedroom thermostat"
    heater: input_boolean.climate_bedroom_heater_state
    target_sensor: sensor.bedroom_temperature
    min_temp: 55
    max_temp: 85
    target_temp: 68
    cold_tolerance: 0.5
    hot_tolerance: 0.5

# ---------------------------------------------------------------------------
# Template sensors — read-only entities the LLM can query
# ---------------------------------------------------------------------------
# Driven by input_numbers above, so you can simulate weather changes etc.
# from Developer Tools without restarting HA.
template:
  - sensor:
      - name: "Outdoor temperature"
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.outdoor_temperature_value') }}"
      - name: "Indoor humidity"
        unit_of_measurement: "%"
        device_class: humidity
        state: "{{ states('input_number.indoor_humidity_value') }}"
      - name: "Living room temperature"
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.living_room_temperature_value') }}"
      - name: "Bedroom temperature"
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.bedroom_temperature_value') }}"

  - binary_sensor:
      - name: "Package arrived"
        device_class: occupancy
        state: "{{ is_state('input_boolean.package_arrived_state', 'on') }}"

# ---------------------------------------------------------------------------
# Media players — use the demo platform
# ---------------------------------------------------------------------------
# `demo` enables a handful of fake media_player entities at startup. Their
# entity_ids vary by HA version (e.g. media_player.bedroom,
# media_player.living_room, media_player.lounge_room, media_player.walkman).
# After the first start, run:
#   docker exec homeassistant python -c \
#     "import json,urllib.request,os;print('see Developer Tools > States')"
# or just open http://localhost:8123/developer-tools/state and filter on
# `media_player.` to see what was created. configure_assist.sh exposes
# everything in the media_player domain to Assist, so the model can target
# whatever exists by spoken name.
#
# Friendly-name overrides for these entities live in
# configuration_additions.yaml (single `homeassistant:` block).
media_player:
  - platform: demo
