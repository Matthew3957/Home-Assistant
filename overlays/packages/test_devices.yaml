      bedroom_lamp:
        friendly_name: "Bedroom nightstand lamp"
        value_template: "{{ is_state('input_boolean.light_bedroom_lamp_state', 'on') }}"
        level_template: "{{ states('input_number.light_bedroom_lamp_brightness') | int(0) }}"
        turn_on:
          - service: input_boolean.turn_on
            target: { entity_id: input_boolean.light_bedroom_lamp_state }
        turn_off:
          - service: input_boolean.turn_off
            target: { entity_id: input_boolean.light_bedroom_lamp_state }
        set_level:
          - service: input_number.set_value
            target: { entity_id: input_number.light_bedroom_lamp_brightness }
            data: { value: "{{ brightness }}" }
          - service: input_boolean.turn_on
